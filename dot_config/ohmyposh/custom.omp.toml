console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 4
final_space = true

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'os'
style = 'plain'
background = 'transparent'
template = '{{ .Icon }} '

[[blocks.segments]]
type = 'session'
style = 'powerline'
background = 'transparent'
foreground = 'white'
template = "{{ .UserName }}@"

[[blocks.segments]]
type = 'session'
style = 'powerline'
background = 'transparent'
foreground = '#9a3b3b'
template = "{{ .HostName }}"

[[blocks.segments]]
type = 'path'
style = 'powerline'
background = 'transparent'
foreground = '#6a9fb5'
template = "[{{ .Path }}]"

[blocks.segments.options]
style = 'full'

[[blocks.segments]]
type = "git"
style = "powerline"
powerline_symbol = "\uE0B0"
foreground = "#95ffa4"
# background = "#2b3440"
background = "transparent"
foreground_templates = [
  "{{ if or (.Working.Changed) (.Staging.Changed) }}#FFD866{{ end }}",
  "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#FFCC80{{ end }}",
  "{{ if gt .Ahead 0 }}#B388FF{{ end }}",
  "{{ if gt .Behind 0 }}#B388FB{{ end }}"
]
template = " {{ .UpstreamIcon }}{{ .HEAD }}{{ if .BranchStatus }} <#B388FF>{{ .BranchStatus }}</>{{ end }}{{ if .Working.Changed }} <#FF9E64>\uF044 {{ .Working.String }}</>{{ end }}{{ if .Staging.Changed }} <#95ffa4>\uF046 {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }} <#7AA2F7>\uEB4B {{ .StashCount }}</>{{ end }} "


[blocks.segments.options]
branch_icon = ''
commit_icon = '@'
fetch_status = true
fetch_upstream_icon = true
fetch_stash_count = true

[[blocks]]
type = 'prompt'
alignment = 'right'
overflow = 'break'

[[blocks.segments]]
type = 'python'
style = 'plain'
background = 'transparent'
foreground = '#FFE873'
template = '{{ if .Venv }}Activate ({{ .Venv }}){{ end }}'

[blocks.segments.options]
display_mode = 'environment'
fetch_virtual_env = true

[[blocks]]
type = 'rprompt'
overflow = 'hidden'

[[blocks.segments]]
type = 'executiontime'
style = 'plain'
foreground = '#E5C07B'
background = 'transparent'
template = '{{ .FormattedMs }}'

[blocks.segments.options]
threshold = 100

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'text'
style = 'plain'
background = 'transparent'
foreground_templates = ['{{ if gt .Code 0 }}#9a3b3b{{ else }}#90a959{{ end }}']
template = '$'

[transient_prompt]
background = 'transparent'
foreground_templates = ['{{ if gt .Code 0 }}#9a3b3b{{ else }}#90a959{{ end }}']
template = '>> '

[secondary_prompt]
foreground = '#90a959'
background = 'transparent'
# multiline_keepprompt = true
template = '$$ '
